<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>{{ brand_title }} — Access</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--cyan:#00e5ff;--purple:#a855f7;--green:#35e48a;--red:#ff667d;--muted:#a9b7c7}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#05070c;color:#f7fbff;font-family:Rajdhani,system-ui,sans-serif}
    body{padding:18px 12px 28px;overflow-x:hidden}
    body:before{content:"";position:fixed;inset:-30%;z-index:-2;background:radial-gradient(circle at 20% 15%,#06445c55,transparent 35%),radial-gradient(circle at 90% 80%,#64107c44,transparent 36%)}
    .shell{width:min(100%,470px);margin:0 auto}
    .card{border:1px solid #1c3851;border-radius:24px;background:linear-gradient(145deg,#0b1520f2,#090c15f7);box-shadow:0 18px 60px #0009;padding:22px 16px}
    .brand{font-family:Orbitron,sans-serif;letter-spacing:1px;text-align:center;font-size:clamp(20px,6vw,30px);font-weight:900;background:linear-gradient(110deg,var(--cyan),#fff,var(--purple));-webkit-background-clip:text;color:transparent}
    .eyebrow{text-align:center;color:var(--muted);font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-top:8px}
    .status{text-align:center;margin:16px 0 12px;font-size:16px;font-weight:700;min-height:24px}
    .sub{text-align:center;color:var(--muted);font-size:13px;line-height:1.45;margin:0 4px 16px}
    .channels{display:flex;flex-direction:column;gap:10px;margin:16px 0}
    .channel{display:flex;gap:11px;align-items:center;border:1px solid #1d3448;background:#0d1a27;border-radius:15px;padding:11px}
    .channel img,.channel-avatar{width:43px;height:43px;border-radius:13px;object-fit:cover;background:linear-gradient(135deg,#124763,#642078);display:grid;place-items:center;font-size:20px;flex:0 0 auto}
    .channel-info{min-width:0;flex:1}.channel-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.channel-state{font-size:12px;color:var(--muted);margin-top:2px}
    .btn{border:0;border-radius:13px;padding:11px 14px;color:#fff;font:700 14px Rajdhani,sans-serif;cursor:pointer;white-space:nowrap}
    .btn:disabled{opacity:.45;cursor:wait}.join{background:linear-gradient(135deg,#087df5,#6247ed)}.verify{background:#173b4b;border:1px solid #24627a}.success{background:transparent;color:var(--green);font-size:24px;padding:5px}
    .primary{width:100%;background:linear-gradient(135deg,#00a9d2,#7148e8);box-shadow:0 7px 22px #0aa4d433}
    .lecture{display:block;text-align:center;margin:17px 0 8px;color:#7eeeff;text-decoration:none;font-size:15px;font-weight:700;word-break:break-word}
    .share{display:block;text-align:center;color:#ffc86b;text-decoration:none;font-size:14px;font-weight:700;padding:10px}
    .hint{font-size:11px;color:#8499ab;text-align:center;line-height:1.45;margin:15px 6px 0}
    .home-icon{font-size:47px;text-align:center;margin:5px 0 4px}
    .loader{display:inline-block;width:15px;height:15px;border:2px solid #ffffff55;border-top-color:#fff;border-radius:50%;vertical-align:-3px;animation:spin .8s linear infinite;margin-right:6px}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:360px){.channel{padding:9px}.btn{padding:10px 10px;font-size:13px}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="card">
      <div class="home-icon" id="hero">🔐</div>
      <div class="brand">{{ brand_title }}</div>
      <div class="eyebrow" id="eyebrow">Secure access panel</div>
      <div class="status" id="status"><span class="loader"></span>Loading...</div>
      <p class="sub" id="subtitle"></p>
      <div id="content"></div>
      <a class="lecture" id="lecture" href="{{ lecture_url }}" target="_blank" rel="noopener">{{ lecture_label }}</a>
      <a class="share" id="share" href="#">👥 Share with Friends</a>
      <p class="hint">Open inside Telegram for membership verification and secure link access.</p>
    </section>
  </main>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="//libtl.com/sdk.js" data-zone="{{ monetag_zone_id }}" data-sdk="show_{{ monetag_zone_id }}"></script>
  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); }
    const token = {{ token|tojson }};
    const zoneId = {{ monetag_zone_id|tojson }};
    const apiHeaders = () => ({
      "Content-Type": "application/json",
      "X-TG-Init-Data": tg ? (tg.initData || "") : ""
    });
    const statusEl = document.getElementById("status");
    const subtitleEl = document.getElementById("subtitle");
    const contentEl = document.getElementById("content");
    const lectureEl = document.getElementById("lecture");
    const shareEl = document.getElementById("share");
    let state = null;
    let lastAdAt = 0;
    let joinAdBusy = false;

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.style.color = kind === "ok" ? "var(--green)" : kind === "error" ? "var(--red)" : "";
    }
    function openTelegram(url) {
      if (tg && /^https:\/\/t\.me\//i.test(url) && tg.openTelegramLink) tg.openTelegramLink(url);
      else if (tg && tg.openLink) tg.openLink(url, {try_instant_view:false});
      else window.open(url, "_blank", "noopener");
    }
    function sdkFunction() { return window["show_" + zoneId]; }
    function waitForSdk(maxMs) {
      return new Promise(resolve => {
        const started = Date.now();
        const tick = () => {
          if (typeof sdkFunction() === "function" || Date.now() - started >= maxMs) return resolve();
          setTimeout(tick, 250);
        };
        tick();
      });
    }
    async function playAutomaticAd(force) {
      if (!force && Date.now() - lastAdAt < 25000) return;
      if (joinAdBusy) return;
      joinAdBusy = true;
      try {
        await waitForSdk(2500);
        const fn = sdkFunction();
        if (typeof fn !== "function") return;
        lastAdAt = Date.now();
        const adPromise = Promise.resolve(fn({
          type: "inApp",
          inAppSettings: { frequency: 2, capping: 0.1, interval: 30, timeout: 1, everyPage: false }
        })).catch(() => null);
        // Never trap a user if Monetag has no fill or the SDK hangs.
        await Promise.race([adPromise, new Promise(r => setTimeout(r, 5000))]);
      } finally {
        joinAdBusy = false;
      }
    }
    async function fetchState() {
      const res = await fetch("/api/join-state/" + encodeURIComponent(token), {headers:apiHeaders()});
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Could not load access state");
      return data;
    }
    function makeChannelCard(ch) {
      const row = document.createElement("div");
      row.className = "channel";
      if (ch.image) {
        const img = document.createElement("img");
        img.src = ch.image; img.alt = ""; row.appendChild(img);
      } else {
        const avatar = document.createElement("div");
        avatar.className = "channel-avatar"; avatar.textContent = "📢"; row.appendChild(avatar);
      }
      const info = document.createElement("div");
      info.className = "channel-info";
      const name = document.createElement("div");
      name.className = "channel-name"; name.textContent = ch.name;
      const small = document.createElement("div");
      small.className = "channel-state"; small.textContent = ch.joined ? "Verified membership" : "Join and verify";
      info.append(name, small); row.appendChild(info);
      if (ch.joined) {
        const done = document.createElement("div");
        done.className = "success"; done.textContent = "✓"; row.appendChild(done);
      } else {
        const wrap = document.createElement("div");
        const join = document.createElement("button");
        join.className = "btn join"; join.textContent = "Join";
        join.onclick = () => openTelegram(ch.joinUrl);
        const verify = document.createElement("button");
        verify.className = "btn verify"; verify.textContent = "Verify";
        verify.style.marginTop = "5px";
        verify.onclick = () => verifyChannel(ch.index, verify);
        wrap.append(join, verify); row.appendChild(wrap);
      }
      return row;
    }
    async function verifyChannel(index, button) {
      button.disabled = true; button.textContent = "Checking...";
      try {
        const res = await fetch("/api/verify-channel/" + encodeURIComponent(token) + "/" + index, {method:"POST", headers:apiHeaders(), body:"{}"});
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Verification failed");
        if (!data.verified) {
          setStatus("❌ Join this channel first", "error");
          button.disabled = false; button.textContent = "Verify";
          return;
        }
        state = data.state;
        renderProtected();
        if (data.adRequired) {
          setStatus("✅ Joined — showing a quick ad...", "ok");
          await playAutomaticAd(true);
          renderProtected();
        }
      } catch (e) {
        setStatus("❌ " + e.message, "error");
        button.disabled = false; button.textContent = "Verify";
      }
    }
    async function unlock() {
      const unlockBtn = document.getElementById("unlock");
      if (unlockBtn) { unlockBtn.disabled = true; unlockBtn.innerHTML = '<span class="loader"></span>Preparing ad...'; }
      try {
        const started = await fetch("/api/ad/start/" + encodeURIComponent(token), {method:"POST", headers:apiHeaders(), body:"{}"});
        const session = await started.json();
        if (!started.ok) throw new Error(session.detail || "Join verification required");
        const adStartedAt = Date.now();
        await playAutomaticAd(true);
        const waitMs = Math.max(0, (session.minSeconds * 1000) - (Date.now() - adStartedAt));
        if (waitMs) await new Promise(r => setTimeout(r, waitMs));
        let claimed = false, lastError = "Ad could not be verified";
        for (let attempt = 0; attempt < 12 && !claimed; attempt++) {
          const res = await fetch("/api/ad/claim/" + encodeURIComponent(token), {
            method:"POST", headers:apiHeaders(), body:JSON.stringify({adToken:session.adToken})
          });
          const data = await res.json();
          if (res.ok) {
            claimed = true;
            setStatus("✅ Link unlocked", "ok");
            contentEl.innerHTML = "";
            const open = document.createElement("button");
            open.className = "btn primary"; open.textContent = "🚀 Open Telegram Link";
            open.onclick = () => { openTelegram(data.url); if (tg && tg.close) setTimeout(() => tg.close(), 900); };
            contentEl.appendChild(open);
            return;
          }
          lastError = data.detail || lastError;
          if (res.status !== 425) break;
          await new Promise(r => setTimeout(r, 1000));
        }
        throw new Error(lastError);
      } catch (e) {
        setStatus("❌ " + e.message, "error");
        if (unlockBtn) { unlockBtn.disabled = false; unlockBtn.textContent = "🔓 Try Unlock Again"; }
      }
    }
    function renderHome() {
      document.getElementById("hero").textContent = "📚";
      document.getElementById("eyebrow").textContent = "Lecture access";
      setStatus("Ready to open", "ok");
      subtitleEl.textContent = "Open the lecture below or share this bot with a friend.";
      contentEl.innerHTML = "";
      const open = document.createElement("button");
      open.className = "btn primary"; open.textContent = "📖 Open Lecture";
      open.onclick = () => openTelegram(state.lectureUrl);
      contentEl.appendChild(open);
      lectureEl.href = state.lectureUrl;
      lectureEl.textContent = state.lectureLabel;
    }
    function renderProtected() {
      document.getElementById("hero").textContent = state.allJoined ? "✅" : "🔐";
      document.getElementById("eyebrow").textContent = "Your protected link";
      subtitleEl.textContent = state.allJoined
        ? "All required channels verified. One final ad unlocks your Telegram link."
        : "Join each required channel, return here and verify. Your progress stays saved.";
      contentEl.innerHTML = "";
      const list = document.createElement("div"); list.className = "channels";
      state.channels.forEach(ch => list.appendChild(makeChannelCard(ch)));
      contentEl.appendChild(list);
      if (state.allJoined) {
        const unlockBtn = document.createElement("button");
        unlockBtn.id = "unlock"; unlockBtn.className = "btn primary";
        unlockBtn.textContent = "🔓 Watch Ad & Open Link";
        unlockBtn.onclick = unlock; contentEl.appendChild(unlockBtn);
      } else {
        const note = document.createElement("div");
        note.className = "hint"; note.textContent = "Already joined channels show a green tick automatically.";
        contentEl.appendChild(note);
      }
    }
    async function init() {
      try {
        state = await fetchState();
        shareEl.href = "https://t.me/share/url?url=" + encodeURIComponent(location.href) + "&text=" + encodeURIComponent("Open this protected lecture link 🔐📚");
        shareEl.onclick = e => { e.preventDefault(); openTelegram(shareEl.href); };
        if (state.home) renderHome();
        else {
          renderProtected();
          playAutomaticAd(false);
        }
      } catch (e) {
        setStatus("❌ " + e.message, "error");
        subtitleEl.textContent = "Please open the link from Telegram and try again.";
        contentEl.innerHTML = "";
      }
    }
    init();
  </script>
</body>
</html>
