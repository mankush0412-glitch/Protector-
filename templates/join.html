<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>{{ brand_title }} — Access</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#08111d;--surface:#0d1b29;--surface2:#101f2f;--cyan:#72edff;--purple:#8f54e8;--green:#35e48a;--red:#ff667d;--muted:#a9b7c7;--blue:#4f8ef7}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:#f7fbff;font-family:Rajdhani,system-ui,sans-serif}
    body{padding:0 12px 28px;overflow-x:hidden}
    body:before{content:"";position:fixed;inset:-30%;z-index:-2;background:radial-gradient(circle at 20% 15%,#06445c33,transparent 35%),radial-gradient(circle at 90% 80%,#64107c33,transparent 36%)}
    .shell{width:min(100%,470px);margin:0 auto}
    .card{border:0;border-radius:0;background:transparent;padding:28px 2px 12px;box-shadow:none}
    .brand{font-family:Orbitron,sans-serif;letter-spacing:1px;text-align:center;font-size:clamp(20px,6vw,30px);font-weight:900;background:linear-gradient(110deg,var(--cyan),#fff,var(--purple));-webkit-background-clip:text;color:transparent}
    .eyebrow{text-align:center;color:var(--muted);font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-top:8px}
    .status{text-align:center;margin:16px 0 12px;font-size:16px;font-weight:700;min-height:0}
    .sub{text-align:center;color:var(--muted);font-size:15px;line-height:1.45;margin:0 auto 20px;max-width:360px}
    .channels{display:flex;flex-direction:column;gap:10px;margin:16px 0 22px}
    .channel{display:flex;gap:11px;align-items:center;border:1px solid #213a52;background:var(--surface);border-radius:15px;padding:13px 14px}
    .channel.joined{border-color:var(--green);background:rgba(34,197,94,.045)}
    .channel img,.channel-avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#235a8a,#642078);display:grid;place-items:center;font-size:20px;flex:0 0 auto;overflow:hidden}
    .channel-info{min-width:0;flex:1;text-align:left}.channel-name{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.channel-state{font-size:13px;color:var(--muted);margin-top:2px}.channel-state.ok{color:var(--green)}
    .btn{border:0;border-radius:14px;padding:11px 15px;color:#fff;font:700 15px Rajdhani,sans-serif;cursor:pointer;white-space:nowrap}
    .btn:disabled{opacity:.55;cursor:default}.join{background:linear-gradient(135deg,#4f8ef7,#4f8ef7)}.verify{background:#173b4b;border:1px solid #24627a}.success{background:transparent;color:var(--green);font-size:28px;padding:5px}.joined-btn{background:#22c55e;color:#fff;padding:9px 14px}
    .primary{width:100%;background:linear-gradient(135deg,#4f8ef7,#7c5cbf);box-shadow:0 7px 22px #4f8ef744}
    .lecture{display:block;text-align:center;margin:23px 0 10px;color:#72edff;text-decoration:none;font-size:19px;font-weight:700;word-break:break-word}
    .hint{font-size:12px;color:#8499ab;text-align:center;line-height:1.45;margin:16px 6px 0}
    .home-icon{width:76px;height:76px;border-radius:20px;background:linear-gradient(135deg,#4f8ef7,#7c5cbf);font-size:42px;display:grid;place-items:center;text-align:center;margin:5px auto 18px;box-shadow:0 8px 24px #4f8ef755}
    .fj-logo{width:72px;height:72px;border-radius:18px;background:linear-gradient(135deg,#4f8ef7,#7c5cbf);font-size:34px;display:grid;place-items:center;margin:0 auto 20px;box-shadow:0 8px 24px #4f8ef755}
    .fj-title{font-size:20px;font-weight:700;text-align:center;margin-bottom:8px}
    .fj-sub{text-align:center;color:var(--muted);font-size:13px;line-height:1.6;margin:0 auto 24px;max-width:320px}
    .fj-verify{margin-top:4px;font-size:17px;padding:14px 18px}
    .fj-error{text-align:center;color:var(--red);font-size:13px;min-height:20px;margin-top:10px}
    .force-gate{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px 18px;text-align:center}
    .force-gate.visible{display:flex}
    .force-gate .channels{width:100%;max-width:360px;margin:0 0 20px}
    .force-gate .fj-verify{width:100%;max-width:360px}
    .loader{display:none}
    @media(max-width:360px){.channel{padding:10px}.btn{padding:10px 11px;font-size:14px}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="card">
      <div class="home-icon" id="hero">🔐</div>
      <div class="brand">{{ brand_title }}</div>
      <div class="eyebrow" id="eyebrow">Secure access panel</div>
      <div class="status" id="status"></div>
      <p class="sub" id="subtitle"></p>
      <div id="content"></div>
      <a class="lecture" id="lecture" href="{{ lecture_url }}">{{ lecture_label }}</a>
      <p class="hint">Open inside Telegram for membership verification and secure link access.</p>
    </section>
  </main>
  <section class="force-gate" id="forceGate">
    <div class="fj-logo">📚</div>
    <div class="fj-title">Join to Continue</div>
    <div class="fj-sub">Please join our official channel(s) to access the app. It's free and keeps you updated!</div>
    <div class="channels" id="forceChannels"></div>
    <button class="btn primary fj-verify" id="forceVerify">✓ I've Joined — Verify</button>
    <div class="fj-error" id="forceError"></div>
  </section>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="//libtl.com/sdk.js" data-zone="{{ monetag_zone_id }}" data-sdk="show_{{ monetag_zone_id }}"></script>
  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready(); tg.expand();
      if (tg.setHeaderColor) tg.setHeaderColor("#0d1224");
      if (tg.setBackgroundColor) tg.setBackgroundColor("#08111d");
      if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    }
    document.title = {{ brand_title|tojson }};
    const token = {{ token|tojson }};
    const zoneId = {{ monetag_zone_id|tojson }};
    const apiHeaders = () => ({
      "Content-Type": "application/json",
      "X-TG-Init-Data": tg ? (tg.initData || "") : ""
    });
    const statusEl = document.getElementById("status");
    const subtitleEl = document.getElementById("subtitle");
    const contentEl = document.getElementById("content");
    const lectureEl = document.getElementById("lecture");
    const shellEl = document.querySelector(".shell");
    const forceGateEl = document.getElementById("forceGate");
    const forceChannelsEl = document.getElementById("forceChannels");
    shellEl.style.visibility = "hidden";
    let state = null;
    let lastAdAt = 0;
    let joinAdBusy = false;

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.style.display = text ? "block" : "none";
      statusEl.style.color = kind === "ok" ? "var(--green)" : kind === "error" ? "var(--red)" : "";
    }
    function openTelegram(url) {
      if (tg && /^https:\/\/t\.me\//i.test(url) && tg.openTelegramLink) tg.openTelegramLink(url);
      else if (tg && tg.openLink) tg.openLink(url, {try_instant_view:false});
      else window.open(url, "_blank", "noopener");
    }
    function sdkFunction() { return window["show_" + zoneId]; }
    function waitForSdk(maxMs) {
      return new Promise(resolve => {
        const started = Date.now();
        const tick = () => {
          if (typeof sdkFunction() === "function" || Date.now() - started >= maxMs) return resolve();
          setTimeout(tick, 250);
        };
        tick();
      });
    }
    async function playAutomaticAd(force) {
      if (!force && Date.now() - lastAdAt < 25000) return;
      if (joinAdBusy) return;
      joinAdBusy = true;
      try {
        await waitForSdk(700);
        const fn = sdkFunction();
        if (typeof fn !== "function") return;
        lastAdAt = Date.now();
        const adPromise = Promise.resolve(fn({
          type: "inApp",
          inAppSettings: { frequency: 2, capping: 0.1, interval: 30, timeout: 1, everyPage: false }
        })).catch(() => null);
        // Never trap a user if Monetag has no fill or the SDK hangs.
        await Promise.race([adPromise, new Promise(r => setTimeout(r, 2500))]);
      } finally {
        joinAdBusy = false;
      }
    }
    async function fetchState() {
      const res = await fetch("/api/join-state/" + encodeURIComponent(token), {headers:apiHeaders()});
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Could not load access state");
      return data;
    }
    function makeForceJoinCard(ch) {
      const row = document.createElement("div");
      row.className = "channel" + (ch.joined ? " joined" : "");
      const avatar = ch.image
        ? document.createElement("img")
        : document.createElement("div");
      if (ch.image) {
        avatar.src = ch.image;
        avatar.alt = "";
        avatar.onerror = () => {
          avatar.replaceWith(Object.assign(document.createElement("div"), {
            className: "channel-avatar",
            textContent: (ch.name || "?").charAt(0).toUpperCase()
          }));
        };
      } else {
        avatar.className = "channel-avatar";
        avatar.textContent = (ch.name || "?").charAt(0).toUpperCase();
      }
      row.appendChild(avatar);
      const info = document.createElement("div");
      info.className = "channel-info";
      const name = document.createElement("div");
      name.className = "channel-name";
      name.textContent = ch.name;
      const small = document.createElement("div");
      small.className = "channel-state" + (ch.joined ? " ok" : "");
      small.textContent = ch.joined ? "✅ Joined" : "⏳ Not joined yet";
      info.append(name, small);
      row.appendChild(info);
      if (ch.joined) {
        const done = document.createElement("div");
        done.className = "btn joined-btn";
        done.textContent = "✓ Joined";
        row.appendChild(done);
      } else {
        const join = document.createElement("button");
        join.className = "btn join";
        join.textContent = "Join";
        join.onclick = () => openTelegram(ch.joinUrl);
        row.appendChild(join);
      }
      return row;
    }
    async function verifyForceJoin() {
      const button = document.getElementById("forceVerify");
      const error = document.getElementById("forceError");
      if (button) button.disabled = true;
      if (error) error.textContent = "";
      let latest = state;
      try {
        for (const channel of state.channels.filter(ch => !ch.joined)) {
          const res = await fetch(
            "/api/verify-channel/" + encodeURIComponent(token) + "/" + channel.index,
            {method:"POST", headers:apiHeaders(), body:"{}"}
          );
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "Verification failed");
          latest = data.state;
          if (!data.verified) {
            state = latest;
            renderProtected();
            const remaining = latest.channels.filter(ch => !ch.joined).length;
            throw new Error("Please join " + remaining + " more channel(s) above, then verify again.");
          }
          if (data.adRequired) await playAutomaticAd(true);
        }
        state = await fetchState();
        if (!state.allJoined) {
          renderProtected();
          throw new Error("Please join all required channels above, then verify again.");
        }
        renderProtected();
        const openButton = document.getElementById("unlock");
        if (openButton) openButton.disabled = true;
        await playAutomaticAd(true);
        if (openButton) openButton.disabled = false;
      } catch (e) {
        setStatus("", "");
        if (error) error.textContent = e.message;
        if (button) button.disabled = false;
      }
    }
    async function unlock() {
      const unlockBtn = document.getElementById("unlock");
      if (unlockBtn) { unlockBtn.disabled = true; unlockBtn.textContent = "🚀 Open Link"; }
      try {
        const started = await fetch("/api/ad/start/" + encodeURIComponent(token), {method:"POST", headers:apiHeaders(), body:"{}"});
        const session = await started.json();
        if (!started.ok) throw new Error(session.detail || "Join verification required");
        const adStartedAt = Date.now();
        await playAutomaticAd(true);
        const waitMs = Math.max(0, (session.minSeconds * 1000) - (Date.now() - adStartedAt));
        if (waitMs) await new Promise(r => setTimeout(r, waitMs));
        let claimed = false, lastError = "Ad could not be verified";
        for (let attempt = 0; attempt < 12 && !claimed; attempt++) {
          const res = await fetch("/api/ad/claim/" + encodeURIComponent(token), {
            method:"POST", headers:apiHeaders(), body:JSON.stringify({adToken:session.adToken})
          });
          const data = await res.json();
          if (res.ok) {
            claimed = true;
            setStatus("✅ Link unlocked", "ok");
            openTelegram(data.url);
            if (tg && tg.close) setTimeout(() => tg.close(), 900);
            return;
          }
          lastError = data.detail || lastError;
          if (res.status !== 425) break;
          await new Promise(r => setTimeout(r, 1000));
        }
        throw new Error(lastError);
      } catch (e) {
        setStatus("❌ " + e.message, "error");
        if (unlockBtn) { unlockBtn.disabled = false; unlockBtn.textContent = "🔓 Try Unlock Again"; }
      }
    }
    function renderHome() {
      forceGateEl.classList.remove("visible");
      shellEl.style.visibility = "visible";
      document.getElementById("hero").textContent = "📚";
      document.getElementById("eyebrow").textContent = "Lecture access";
      document.getElementById("eyebrow").style.display = "block";
      setStatus("Ready to open", "ok");
      subtitleEl.textContent = "Open the lecture below.";
      contentEl.innerHTML = "";
      const open = document.createElement("button");
      open.className = "btn primary"; open.textContent = "📖 Open Lecture";
      open.onclick = () => openTelegram(state.lectureUrl);
      contentEl.appendChild(open);
      lectureEl.style.display = "block";
      lectureEl.href = state.lectureUrl;
      lectureEl.textContent = state.lectureLabel;
      lectureEl.onclick = (event) => {
        event.preventDefault();
        openTelegram(state.lectureUrl);
      };
    }
    function renderProtected() {
      contentEl.innerHTML = "";
      lectureEl.style.display = "none";
      document.getElementById("eyebrow").style.display = state.allJoined ? "block" : "none";
      if (!state.allJoined) {
        shellEl.style.visibility = "hidden";
        forceChannelsEl.innerHTML = "";
        state.channels.forEach(ch => forceChannelsEl.appendChild(makeForceJoinCard(ch)));
        document.getElementById("forceError").textContent = "";
        document.getElementById("forceVerify").disabled = false;
        document.getElementById("forceVerify").onclick = verifyForceJoin;
        forceGateEl.classList.add("visible");
        return;
      }
      forceGateEl.classList.remove("visible");
      shellEl.style.visibility = "visible";
      document.getElementById("hero").textContent = "🔐";
      document.getElementById("eyebrow").textContent = "Your protected link";
      subtitleEl.textContent = "Your access is verified. The link will open after the short ad step.";
      setStatus("✅ Channels already verified", "ok");
      if (state.allJoined) {
        const unlockBtn = document.createElement("button");
        unlockBtn.id = "unlock"; unlockBtn.className = "btn primary";
        unlockBtn.textContent = "🚀 Open Link";
        unlockBtn.onclick = unlock; contentEl.appendChild(unlockBtn);
      }
    }
    async function init() {
      try {
        state = await fetchState();
        if (state.home) renderHome();
        else {
          renderProtected();
          // Already-joined users see one ad on opening the mini app. Clicking
          // Open Link runs the second server-validated ad before navigation.
          if (state.allJoined) {
            const openButton = document.getElementById("unlock");
            if (openButton) openButton.disabled = true;
            await playAutomaticAd(false);
            if (openButton) openButton.disabled = false;
          }
        }
      } catch (e) {
        shellEl.style.visibility = "visible";
        setStatus("❌ " + e.message, "error");
        subtitleEl.textContent = "Please open the link from Telegram and try again.";
        contentEl.innerHTML = "";
      }
    }
    init();
  </script>
</body>
</html>
