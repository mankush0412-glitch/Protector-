<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEAM LEADER — Access</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --neon-cyan:#00ffff;
  --neon-purple:#b800ff;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Rajdhani', sans-serif;
  background:#000;
  height:100vh;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
}

canvas{
  position:absolute;
  inset:0;
  z-index:-2;
}

.ring{
  position:absolute;
  border-radius:50%;
  border:2px solid rgba(0,255,255,0.3);
  animation:spin 20s linear infinite;
}
.r1{width:500px;height:500px;}
.r2{width:350px;height:350px;animation-direction:reverse}
.r3{width:200px;height:200px;}

@keyframes spin{
  0%{transform:rotate(0)}
  100%{transform:rotate(360deg)}
}

.container{
  background:rgba(0,0,0,0.7);
  padding:50px;
  border-radius:25px;
  text-align:center;
  backdrop-filter:blur(15px);
  box-shadow:0 0 60px rgba(0,255,255,0.5);
  max-width:400px;
}

.logo{
  width:90px;
  height:90px;
  border-radius:50%;
  overflow:hidden;
  margin:auto;
  box-shadow:0 0 30px var(--neon-cyan);
}

.logo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

h1{
  font-family:'Orbitron';
  font-size:2em;
  margin-top:15px;
  background:linear-gradient(135deg,var(--neon-cyan),var(--neon-purple));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.status{
  margin-top:20px;
  font-size:1.2em;
}

button{
  margin-top:25px;
  padding:15px 30px;
  border:none;
  border-radius:30px;
  background:linear-gradient(45deg,#00c6ff,#0072ff);
  color:white;
  font-size:16px;
  cursor:pointer;
  display:none;
  transition:0.3s;
}

button:hover{
  transform:scale(1.1);
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="ring r1"></div>
<div class="ring r2"></div>
<div class="ring r3"></div>

<div class="container">

  <div class="logo">
    <img src="https://i.ibb.co/svvgYRW5/tmpuojdqf2i.jpg">
  </div>

  <h1>TEAM LEADER</h1>

  <div class="status" id="statusText">Verifying Access...</div>

  <button id="btn">🚀 Go to Channel</button>

</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src='//libtl.com/sdk.js' data-zone='10984967' data-sdk='show_10984967'></script>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

/* MONETAG IN-APP INTERSTITIAL
   Ek hi baar call karo — ye khud background me
   frequency/interval ke hisaab se ads dikhata rahega.
   Dobara-dobara call mat karo, warna internal logic reset ho jata hai. */
let adPromise;

if (typeof show_10984967 === "function") {
  adPromise = show_10984967({
    type: 'inApp',
    inAppSettings: {
      frequency: 2,     // max 2 ads per capping window
      capping: 0.1,     // capping window in hours (0.1hr = 6 min)
      interval: 30,     // min 30 sec gap between 2 ads
      timeout: 1,       // request jaldi bhejo, fill/load network pe depend karta hai
      everyPage: false
    }
  }).then((res) => {
    console.log("✅ Monetag inApp resolved:", res);
  }).catch((err) => {
    console.log("❌ Monetag inApp failed:", err);
  });
} else {
  console.log("❌ show_10984967 function nahi mila — SDK load hi nahi hua");
  adPromise = Promise.resolve();
}

/* Ad hamesha resolve/fail ho hi jaye is ki guarantee nahi — isliye
   ek max-wait failsafe rakha hai taaki user hamesha ke liye
   "Verifying Access..." pe atka na rahe (max 15 sec wait). */
const adWait = Promise.race([
  adPromise,
  new Promise((resolve) => setTimeout(resolve, 15000))
]);

const statusText = document.getElementById("statusText");
const btn = document.getElementById("btn");

const token = "{{ token }}";

/* 🔥 STEP 3.3 ADD */
let user_id = null;
try {
  user_id = tg.initDataUnsafe?.user?.id;
} catch(e) {
  user_id = null;
}

/* MATRIX EFFECT */
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const chars = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const arr = chars.split("");

const fontSize = 14;
const cols = canvas.width / fontSize;
const drops = Array(Math.floor(cols)).fill(1);

function draw(){
  ctx.fillStyle = "rgba(0,0,0,0.05)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "#0ff";
  ctx.font = fontSize + "px monospace";

  for(let i=0;i<drops.length;i++){
    const text = arr[Math.floor(Math.random()*arr.length)];
    ctx.fillText(text,i*fontSize,drops[i]*fontSize);

    if(drops[i]*fontSize > canvas.height && Math.random()>0.975){
      drops[i]=0;
    }
    drops[i]++;
  }
}
setInterval(draw,40);

/* VERIFY SYSTEM */
async function verify(){
  try{

    if(!user_id){
      statusText.innerText = "❌ Open via Telegram";
      return;
    }

    const res = await fetch(`/getgrouplink/${token}`);
    const data = await res.json();

    if(data.error){
      statusText.innerText = "❌ " + data.error;
      return;
    }

    /* Jab tak ad complete/timeout na ho, "Verifying Access..." hi dikhega */
    await adWait;

    statusText.innerText = "✅ Link Verified";
    btn.style.display = "inline-block";

    btn.onclick = () => {
      tg.openTelegramLink(data.url);
      setTimeout(()=>tg.close(),1000);
    };

  }catch{
    statusText.innerText = "❌ Server Error";
  }
}

setTimeout(verify,4500);
</script>

</body>
</html>
