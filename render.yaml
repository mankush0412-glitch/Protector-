services:
  - type: web
    name: telegram-bot
    env: python
    buildCommand: |
      pip install --upgrade pip
      pip install python-telegram-bot[webhooks]==20.7
      pip install pymongo[srv]==4.6.0
      pip install fastapi==0.104.1
      pip install uvicorn[standard]==0.24.0
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MONGO_URL
        sync: false
      - key: RENDER_EXTERNAL_URL
        fromService:
          name: telegram-bot
          type: web
          property: url
      - key: ADMIN_USER_ID
        sync: false
      - key: SUPPORT_CHANNELS
        sync: false
      - key: SUPPORT_CHANNELS_CONFIG
        sync: false
      - key: MONETAG_ZONE_ID
        value: 11609595
      - key: START_LECTURE_URL
        value: https://telegra.ph/𝗟𝗘𝗖𝗧𝗨𝗥𝗘𝗦-𝗟𝗜𝗦𝗧-03-24-2
      - key: BRAND_TITLE
        value: TEAM LEADER
      - key: AD_JOIN_FREQUENCY
        value: 2
      - key: AD_MIN_SECONDS
        value: 8
      - key: SUPPORT_CHANNEL_ID
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /health
    autoDeploy: true
